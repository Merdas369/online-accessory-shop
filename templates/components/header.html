{% load static %}
{% load widget_tweaks %}


<div class="flex mt-4 mb-12 items-center justify-between">
    <div>
        <div class="flex">
            <div class=" p-0 mb-6"><img class="absolute right-8 top-2" src="{% static 'icons/search-icon.png' %}"
                    alt="search-icon"></div>
            <div class="absolute right-1 top-2">
                <form method="get" class=" w-auto" hx-get="{% url 'products' %}" hx-target="#products"
                    hx-swap="outerHTML" HX-Trigger="enterkey">

                    {% render_field form.title class='search-input' placeholder='جستوجو' %}

                </form>
            </div>
        </div>
    </div>
    <div class=" pr-52">
        <h1 class="font-[IRDastNevis] font-extrabold font-stretch-200% text-4xl text-neutral">
            فروشگاه آنلاین اکسسوری
        </h1>
    </div>
    <div class="self-start">
        <div class="flex">
            <a href="#" class="px-2.5">ورود</a>
            <a href="#" class="px-2.5">لیست علاقمندی ها</a>
            <span class="flex">
                <img class="inline-block absolute left-12 top-3.5 px-2" src="{% static 'icons/shop-icon.png' %}" alt="">
                <a href="#" class="px-2.5 text-nowrap">سبد خرید</a>


                <div id="cart-badge">
                    {% if cart_count %}
                    <span
                        class="rounded-full w-6 h-6 text-center text-white text-white align-text-top bg-primary absolute top-8 left-12 p-1">
                        {{cart_count}}
                    </span>
                    {% endif %}
                </div>


            </span>

        </div>
    </div>


</div>
