{% load static %}

<div class="inline-block w-1/6 mr-[20px] mb-[18px] h-full">
    <div class=" product-card__badge-container">

    </div>
    <div class="flex flex-col">


        <a href="#">
            <img class="object-cover" src="{{product.images.first.image.url}}"
                alt="{{ product.images.first.alt_text }}">

        </a>
        <button class=" btn-secondary">
            اضافه کردن به علاقمندی ها
        </button>



        <div class=" product-card__data-container">
            <div>
                <a href="#" class="decoration-0 bg-transparent text-neutral">
                    <h2 class="product-card__title">
                        {{product.title}}
                    </h2>
                    <p>
                        {{product.short_description}}
                    </p>
                </a>
            </div>
            <div>
                <p class="product-card__price font-bold h-section pt-6">
                    {{product.variants.first.price}} هزار تومان
                </p>
            </div>

        </div>
    </div>
</div>
